<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TV Series Posts | MoviMoon</title><meta name="description" content="MoviMoon Blog with movie and TV information, ratings, trailers and Watch Now links."><link rel="canonical" href="https://movimoon.pages.dev/blog/tv-series-posts"><style>body{margin:0;background:#0a0e1a;color:#f0f4ff;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.brand{font-size:24px;font-weight:900;color:#fff;text-decoration:none}.nav{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.nav a{color:#a8b2c1;text-decoration:none;border:1px solid rgba(255,255,255,.1);padding:8px 12px;border-radius:999px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}.empty{padding:30px;background:#101624;border:1px solid rgba(255,255,255,.08);border-radius:14px;color:#a8b2c1}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.wrap{padding:14px}}</style></head><body><main class="wrap"><a class="brand" href="https://movimoon.pages.dev">MoviMoon Blog</a><nav class="nav"><a href="/blog">All Posts</a><a href="/blog/movie-posts">Movie Posts</a><a href="/blog/tv-series-posts">TV Series Posts</a></nav><h1>TV Series Posts</h1><div id="posts" class="grid"><div class="empty">Loading posts…</div></div></main><script>const SECTION='tv';fetch('/data/blog-posts.json?v=36').then(r=>r.json()).then(d=>{const p=(d.posts||[]).filter(x=>!SECTION||x.type===SECTION);const el=document.getElementById('posts');if(!p.length){el.innerHTML='<div class="empty">No posts have been published yet.</div>';return}el.innerHTML=p.map(x=>`<a href="${x.url}" style="text-decoration:none;color:#fff;background:#101624;border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden"><img src="${x.image||''}" alt="${x.displayTitle||x.title}" loading="lazy" style="width:100%;aspect-ratio:2/3;object-fit:cover;display:block"><div style="padding:12px"><b>${x.displayTitle||x.title}</b><div style="color:#a8b2c1;font-size:12px;margin-top:6px">${x.year||''} · ⭐ ${x.rating?Number(x.rating).toFixed(1):'N/A'}</div></div></a>`).join('')}).catch(()=>document.getElementById('posts').innerHTML='<div class="empty">Blog data is temporarily unavailable.</div>');</script></body></html>
